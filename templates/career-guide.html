<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guide</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <div class="logo-wrap">
                <div class="logo-badge">AI</div>
                <div><h1>AI Career Guide</h1></div>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">☰</button>
            <nav class="main-nav" id="main-nav">
                <a href="/">Home</a>
                <a href="/career-guide">Career Guide</a>
                <a href="/resume-analyzer">Resume Analyzer</a>
                <a href="/job-analyzer">Job Analyzer</a>
                <a href="/interview-prep">Interview Prep</a>
                <a href="/dashboard">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <div class="container narrow-container">
            <section class="content-card">
                <div class="section-heading">
                    <span class="eyebrow">AI Career Guide</span>
                    <h2>Create a personalized roadmap</h2>
                </div>

                <form id="career-form" class="form-grid">
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" required>
                    </div>
                    <div class="field">
                        <label for="target_role">Target Job Role</label>
                        <input id="target_role" name="target_role" type="text" required placeholder="Data Analyst">
                    </div>
                    <div class="field full">
                        <label for="current_skills">Current Skills</label>
                        <input id="current_skills" name="current_skills" type="text" required placeholder="Python, SQL, Excel">
                    </div>
                    <div class="field">
                        <label for="education">Education</label>
                        <input id="education" name="education" type="text" required placeholder="B.Tech CSE">
                    </div>
                    <div class="field">
                        <label for="experience_level">Experience Level</label>
                        <select id="experience_level" name="experience_level" required>
                            <option value="">Select</option>
                            <option>Fresher</option>
                            <option>0-1 years</option>
                            <option>1-3 years</option>
                            <option>3+ years</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="available_hours">Available hours per day</label>
                        <input id="available_hours" name="available_hours" type="text" required placeholder="2 hours/day">
                    </div>
                    <div class="field full">
                        <label for="career_goal">Career Goal</label>
                        <textarea id="career_goal" name="career_goal" rows="4" required placeholder="Get an entry-level Data Analyst job"></textarea>
                    </div>
                    <div class="field">
                        <label for="certifications">Current certifications</label>
                        <input id="certifications" name="certifications" type="text" placeholder="Optional">
                    </div>
                    <div class="field">
                        <label for="projects">Projects</label>
                        <input id="projects" name="projects" type="text" placeholder="Optional">
                    </div>
                    <div class="field">
                        <label for="learning_style">Preferred learning style</label>
                        <input id="learning_style" name="learning_style" type="text" placeholder="Videos / Documentation / Practice">
                    </div>
                    <div class="field">
                        <label for="preferred_domain">Preferred technology/domain</label>
                        <input id="preferred_domain" name="preferred_domain" type="text" placeholder="Optional">
                    </div>

                    <div class="full actions-row">
                        <button type="submit" class="btn btn-primary">Generate Roadmap</button>
                    </div>
                </form>

                <div id="career-loader" class="loader hidden">
                    <div class="spinner"></div>
                    <p>Analyzing your skills and building your roadmap...</p>
                </div>
                <div id="career-result" class="result-panel hidden"></div>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/career.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
